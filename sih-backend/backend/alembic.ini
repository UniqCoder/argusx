# Alembic configuration file — used by `alembic` CLI tool.
# Values are overridden by env vars / app settings where possible.

[alembic]
# Migrations live here
script_location = app/db/alembic

# Constructed at runtime in env.py from the DATABASE_URL env var (sync version)
sqlalchemy.url = postgresql://unigraph:changeme_in_prod@postgres:5432/unigraph

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
